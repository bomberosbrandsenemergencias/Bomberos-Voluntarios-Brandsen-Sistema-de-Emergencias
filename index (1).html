<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Gestión de Emergencias Bomberos Voluntarios Brandsen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

  :root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#f5f7f9;
    --text:#1a222c;
    --text-muted:#5c6773;
    --border:#d7dee4;
    --accent:#c4501c;
    --accent-contrast:#ffffff;
    --accent-soft:#f7e3d6;
    --ok:#1e8a5f;
    --ok-bg:#dff2e9;
    --danger:#c92a2a;
    --danger-bg:#fbe3e3;
    --warn:#9a6b00;
    --warn-bg:#faedcf;
    --shadow: 0 1px 2px rgba(20,26,33,.06), 0 4px 12px rgba(20,26,33,.05);
    --focus: 0 0 0 3px rgba(196,80,28,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10151b;
      --surface:#181f27;
      --surface-2:#1f2731;
      --text:#e8ecf0;
      --text-muted:#9aa7b3;
      --border:#2b3540;
      --accent:#e2814a;
      --accent-contrast:#141414;
      --accent-soft:#3a2a1f;
      --ok:#4fd39a;
      --ok-bg:#173428;
      --danger:#ff7a7a;
      --danger-bg:#3a1c1c;
      --warn:#e0b84f;
      --warn-bg:#3a2f13;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
      --focus: 0 0 0 3px rgba(226,129,74,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10151b;
    --surface:#181f27;
    --surface-2:#1f2731;
    --text:#e8ecf0;
    --text-muted:#9aa7b3;
    --border:#2b3540;
    --accent:#e2814a;
    --accent-contrast:#141414;
    --accent-soft:#3a2a1f;
    --ok:#4fd39a;
    --ok-bg:#173428;
    --danger:#ff7a7a;
    --danger-bg:#3a1c1c;
    --warn:#e0b84f;
    --warn-bg:#3a2f13;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
    --focus: 0 0 0 3px rgba(226,129,74,.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed','Public Sans',sans-serif;
    text-transform:uppercase;
    letter-spacing:.03em;
    text-wrap:balance;
    font-weight:700;
    margin:0;
  }
  button, select, input, textarea{ font-family:inherit; font-size:15px; }
  a{ color:var(--accent); }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .brand-mark{
    width:40px; height:40px; border-radius:50%;
    flex:none; overflow:hidden;
    border:1px solid var(--border); box-shadow:var(--shadow);
    background:var(--surface-2);
  }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-text h1{ font-size:22px; line-height:1; color:var(--text); }
  .brand-text p{ margin:3px 0 0; font-size:12.5px; color:var(--text-muted); }
  .live-pill{
    display:flex; align-items:center; gap:6px;
    padding:6px 11px; border-radius:99px;
    background:var(--ok-bg); color:var(--ok);
    font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); animation:pulse 2s infinite; }
  @media (prefers-reduced-motion:reduce){ .live-dot{ animation:none; } }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- layout ---------- */
  .shell{ flex:1; display:flex; min-height:0; }
  nav.side{
    width:190px; flex:none; padding:16px 10px;
    border-right:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; gap:2px;
  }
  nav.side button{
    all:unset; cursor:pointer; padding:10px 12px; border-radius:8px;
    font-size:14.5px; font-weight:600; color:var(--text-muted);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  nav.side button:hover{ background:var(--surface-2); color:var(--text); }
  nav.side button.active{ background:var(--accent-soft); color:var(--accent); }
  nav.side button:focus-visible{ box-shadow:var(--focus); }
  nav.side .count{
    font-size:11.5px; padding:1px 7px; border-radius:99px;
    background:var(--danger-bg); color:var(--danger); font-weight:700;
  }

  main{ flex:1; min-width:0; padding:22px; overflow-y:auto; }
  .view{ max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }

  /* ---------- kpis ---------- */
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .kpi .n{ font-family:'Barlow Condensed'; font-size:34px; font-weight:700; line-height:1; }
  .kpi .l{ font-size:12px; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.04em; }
  .kpi.ok .n{ color:var(--ok); } .kpi.danger .n{ color:var(--danger); } .kpi.warn .n{ color:var(--warn); }

  /* ---------- section headers ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .section-head h2{ font-size:20px; color:var(--text); }
  .section-head .sub{ font-size:12.5px; color:var(--text-muted); }

  /* ---------- unit grid ---------- */
  .unit-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .unit-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 13px; box-shadow:var(--shadow); border-left:4px solid var(--ok);
  }
  .unit-card.busy{ border-left-color:var(--danger); }
  .unit-card .top{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .unit-card .num{ font-family:'Barlow Condensed'; font-size:19px; font-weight:700; }
  .chip{
    font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    padding:3px 8px; border-radius:99px; white-space:nowrap;
  }
  .chip.ok{ background:var(--ok-bg); color:var(--ok); }
  .chip.danger{ background:var(--danger-bg); color:var(--danger); }
  .chip.warn{ background:var(--warn-bg); color:var(--warn); }
  .chip.neutral{ background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
  .chip.evento{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .unit-card .grp{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .unit-card .detail{ margin-top:8px; font-size:12.5px; color:var(--text); border-top:1px solid var(--border); padding-top:7px; }
  .unit-card .detail b{ display:block; font-size:13px; }

  /* ---------- cards / forms ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:var(--shadow); }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field select, .field textarea{
    padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface-2); color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; box-shadow:var(--focus); border-color:var(--accent); }
  .grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .grid3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }

  .toggle-group{ display:flex; flex-wrap:wrap; gap:7px; }
  .toggle-chip{
    all:unset; cursor:pointer; padding:7px 12px; border-radius:8px; font-size:13px; font-weight:600;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
  }
  .toggle-chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .toggle-chip:focus-visible{ box-shadow:var(--focus); }
  .toggle-chip.small{ padding:5px 9px; font-size:12px; }
  .toggle-chip.busy{ background:var(--danger-bg); border-color:var(--danger); color:var(--danger); opacity:.9; }
  .toggle-chip.busy:disabled{ cursor:not-allowed; }
  .toggle-chip.busy:not(:disabled){ cursor:pointer; }
  .toggle-chip.busy:not(:disabled):hover{ background:var(--danger); color:var(--accent-contrast); }
  .personal-picker{ max-height:150px; overflow-y:auto; padding:6px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); }
  .personal-picker-grupo{ margin-bottom:8px; }
  .personal-picker-grupo:last-child{ margin-bottom:0; }
  .personal-picker-grupo-label{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  .reasignar-confirm{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; padding:7px 10px; border:1px solid var(--danger); background:var(--danger-bg); color:var(--danger); border-radius:8px; font-size:12.5px; line-height:1.4; }
  .btn-mini{ border:1px solid var(--danger); background:var(--danger); color:var(--accent-contrast); border-radius:6px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; }
  .btn-mini:hover{ filter:brightness(1.08); }
  .btn-mini.ghost{ background:transparent; color:var(--text-muted); border-color:var(--border); font-weight:500; }
  .btn-mini.ghost:hover{ background:var(--surface-2); }

  .btn{
    all:unset; cursor:pointer; padding:10px 18px; border-radius:9px; font-weight:700;
    font-size:14px; text-align:center; letter-spacing:.01em;
  }
  .btn.primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.danger-outline{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn:focus-visible{ box-shadow:var(--focus); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* ---------- servicio feed ---------- */
  .feed{ display:flex; flex-direction:column; gap:10px; }
  .svc{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; box-shadow:var(--shadow); border-left:4px solid var(--danger);
    display:flex; flex-direction:column; gap:8px;
  }
  .svc.cerrado{ border-left-color:var(--border); opacity:.82; }
  .svc.seleccionado{ outline:2px solid var(--accent); outline-offset:-1px; background:var(--accent-soft); }
  .svc .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .svc .tipo{ font-family:'Barlow Condensed'; font-size:19px; font-weight:700; }
  .svc .meta{ font-size:12.5px; color:var(--text-muted); }
  .svc .direccion{ font-size:14px; }
  .svc .tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .svc .obs{ font-size:13px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:8px; }
  .svc .foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }

  /* ---------- personal table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  .group-row td{ background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600; padding:6px 10px; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); }
  .table-wrap table{ min-width:860px; }
  .presente-btn{
    cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    border-radius:8px; padding:10px 14px; font-size:13px; font-weight:700; white-space:nowrap;
    min-width:128px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .presente-btn:hover{ background:var(--surface-2); }
  .presente-btn.on{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .presente-btn:focus-visible{ box-shadow:var(--focus); }
  input[type=search]{ padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface); min-width:220px; }

  /* ---------- centros ---------- */
  .centro-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .centro{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; }
  .centro h3{ font-size:17px; text-transform:none; letter-spacing:0; }
  .centro .line{ font-size:12.5px; color:var(--text-muted); }
  .centro .amenities{ display:flex; gap:6px; margin-top:4px; }

  .empty{ padding:40px 20px; text-align:center; color:var(--text-muted); font-size:14px; }
  .informe-preview{
    margin-top:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:14px; font-family:'Courier New', monospace; font-size:12.5px; line-height:1.5;
    white-space:pre-wrap; max-height:480px; overflow-y:auto;
  }

  /* ---------- manage / inline edit ---------- */
  .btn.small{ padding:6px 12px; font-size:12.5px; border-radius:7px; }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .inline-form{ background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:16px; margin-bottom:4px; }
  .inline-form .grid3, .inline-form .grid2{ margin-bottom:12px; }
  .check-row{ display:flex; gap:16px; align-items:center; }
  .check-row label{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text); cursor:pointer; }
  .unit-card{ position:relative; }
  .unit-card .manage-actions{ position:absolute; top:8px; right:8px; display:flex; gap:6px; }
  .unit-card .manage-actions button{ all:unset; cursor:pointer; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px; }
  .unit-card .manage-actions .edit-link{ color:var(--text-muted); }
  .unit-card .manage-actions .edit-link:hover{ background:var(--surface-2); }
  .unit-card .manage-actions .remove{ color:var(--danger); }
  .unit-card .manage-actions .remove:hover{ background:var(--danger-bg); }
  .mini-input{ padding:7px 9px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); font-size:13.5px; }
  td input, td select{ padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); color:var(--text); font-size:13.5px; width:100%; }
  td .check-row{ gap:10px; }

  /* ---------- mobile ---------- */
  .topnav-mobile{ display:none; }
  @media (max-width:820px){
    nav.side{ display:none; }
    .topnav-mobile{
      display:flex; gap:4px; overflow-x:auto; padding:8px 12px;
      background:var(--surface); border-bottom:1px solid var(--border);
    }
    .topnav-mobile button{
      all:unset; cursor:pointer; padding:8px 13px; border-radius:99px; font-size:13px; font-weight:700;
      background:var(--surface-2); color:var(--text-muted); white-space:nowrap; flex:none;
    }
    .topnav-mobile button.active{ background:var(--accent); color:var(--accent-contrast); }
    main{ padding:16px; }
    .brand-text p{ display:none; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var TABS = [
    {id:"tablero", label:"Tablero"},
    {id:"servicios", label:"Servicios"},
    {id:"personal", label:"Personal"},
    {id:"centros", label:"Centros de Evac."},
    {id:"situacion", label:"Situación"},
    {id:"reportes", label:"Reportes"}
  ];
  var GRUPOS_UNIDAD = ["Bomberos","Hospital","Municipio","Policia"];

  // ---------- backend remoto: Google Sheets + Apps Script (reemplaza window.claude.use("db")) ----------
  // URL de la implementación de Apps Script (termina en /exec)
  var URL_BACKEND = "https://script.google.com/macros/s/AKfycbwIGaeak1u-TEu-13-4i0Deupkn27Sm9cNn9sCUWZPAmdM2y6QtcDXatzp-vTOTbXf8/exec";
  var CLAVE_SESION_LOCAL = "gestionEmergenciasBrandsen_sesion";

  // nombre de colección tal como lo usa el frontend (camelCase, heredado del prototipo) vs.
  // el nombre real de la pestaña en la planilla (backend)
  var COLECCION_BACKEND = {
    unidades: "Unidades", servicios: "Servicios", personal: "Personal",
    centrosEvacuacion: "CentrosEvacuacion", ingresosDirectosCentro: "IngresosDirectosCentro",
    rioLecturas: "RioLecturas", riesgoLocalidades: "RiesgoLocalidades",
    helipuertos: "Helipuertos", contactos: "Contactos", bitacoraEventos: "BitacoraEventos"
  };
  // los dos "documento único" que en el prototipo original vivían como db.doc("...")
  var DOC_BACKEND = {
    "situacion/monitoreo": {guardar: "guardarMonitoreo", clave: "Monitoreo"},
    "catalogos/opciones": {guardar: "guardarCatalogos", clave: "Catalogos"}
  };

  // shim que imita la parte de la API tipo Firestore que usa el resto de esta app
  // (collection().doc().set/update/delete/add, collection().onSnapshot, doc().onSnapshot/set),
  // pero hablando por HTTP con el backend de Apps Script. En vez de tiempo real usa sondeo
  // (polling) de una sola llamada ("listarTodo") cada pocos segundos, y solo dispara los
  // listeners de lo que realmente cambió (comparando contra la última respuesta) para no
  // volver a dibujar pantallas donde alguien puede estar escribiendo.
  function crearDBremota(url, token){
    var listenersCol = {};
    var listenersDoc = {};
    var listenersListo = [];
    var yaAvisoListo = false;
    var ultimoJSON = {};
    var timerId = null;
    var SONDEO_MS = 6000;
    var ultimoError = null;
    var listenersCambio = [];
    var sondeoEnVuelo = false;
    var colaEscritura = Promise.resolve();

    // las escrituras (guardar/actualizar/eliminar) nunca se mandan en paralelo desde este
    // navegador: se encolan y se despachan de a una, en orden, para que una tanda de varias
    // juntas (ej. "Borrar todos los presentes") no haga que las últimas esperen tanto el
    // candado del backend que terminen fallando por tiempo agotado
    function llamarEscritura(payload){
      var resultado = colaEscritura.then(function(){ return llamar(payload); });
      colaEscritura = resultado.then(function(){}, function(){});
      return resultado;
    }

    function llamar(payload){
      if(payload.accion !== "listarTodo") console.log("[backend] pide:", payload.accion, payload.coleccion||"", payload.id||"");
      return fetch(url, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify(Object.assign({token: token}, payload))
      }).then(function(resp){
        return resp.json().catch(function(){
          throw new Error("El servidor no respondió correctamente (probá de nuevo en un momento).");
        });
      }).then(function(json){
        if(payload.accion !== "listarTodo") console.log("[backend] responde:", payload.accion, JSON.stringify(json));
        if(!json || !json.ok) throw new Error((json && json.error) || "Error del servidor.");
        return json;
      }).catch(function(e){
        if(payload.accion !== "listarTodo") console.error("[backend] ERROR en", payload.accion, e);
        throw e;
      });
    }

    function avisarColeccion(nombreFrontend, filas){
      var clave = "col:"+nombreFrontend;
      var serial = JSON.stringify(filas);
      if(ultimoJSON[clave] === serial) return;
      if(ultimoJSON[clave] !== undefined) console.log("[sondeo] cambió la colección", nombreFrontend, "-", filas.length, "filas (dispara un re-render)");
      ultimoJSON[clave] = serial;
      var docs = filas.map(function(f){ return {id: f.id, data: function(){ return f; }}; });
      (listenersCol[nombreFrontend]||[]).forEach(function(l){ l.cb({docs: docs}); });
    }

    function avisarDoc(path, datos){
      var clave = "doc:"+path;
      var serial = JSON.stringify(datos);
      if(ultimoJSON[clave] === serial) return;
      if(ultimoJSON[clave] !== undefined) console.log("[sondeo] cambió el documento", path, "(dispara un re-render)");
      ultimoJSON[clave] = serial;
      (listenersDoc[path]||[]).forEach(function(l){ l.cb({exists: !!datos, data: function(){ return datos; }}); });
    }

    function sondear(){
      // si ya hay un sondeo en curso, no arrancamos otro en paralelo (evita que se pisen
      // entre sí contra el candado del backend cuando una lectura tarda más de la cuenta)
      if(sondeoEnVuelo) return Promise.resolve();
      sondeoEnVuelo = true;
      return llamar({accion: "listarTodo"}).then(function(resp){
        if(ultimoError !== null){ ultimoError = null; listenersCambio.forEach(function(fn){ fn(); }); }
        var datos = resp.datos || {};
        Object.keys(COLECCION_BACKEND).forEach(function(nombreFrontend){
          var claveBackend = COLECCION_BACKEND[nombreFrontend];
          if(Object.prototype.hasOwnProperty.call(datos, claveBackend)) avisarColeccion(nombreFrontend, datos[claveBackend]);
        });
        Object.keys(DOC_BACKEND).forEach(function(path){
          var claveBackend = DOC_BACKEND[path].clave;
          if(Object.prototype.hasOwnProperty.call(datos, claveBackend)) avisarDoc(path, datos[claveBackend]);
        });
        if(!yaAvisoListo){
          yaAvisoListo = true;
          listenersListo.forEach(function(fn){ fn(); });
        }
      }).catch(function(e){
        console.error("sondeo", e);
        var msj = (e && e.message) ? e.message : String(e);
        if(ultimoError !== msj){ ultimoError = msj; listenersCambio.forEach(function(fn){ fn(); }); }
      }).then(function(){
        sondeoEnVuelo = false;
      });
    }

    function empezarSondeo(){
      if(timerId) return;
      sondear();
      timerId = setInterval(sondear, SONDEO_MS);
    }

    function idNuevo(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

    function collection(nombreFrontend){
      var claveBackend = COLECCION_BACKEND[nombreFrontend];
      return {
        onSnapshot: function(cb, errCb){
          (listenersCol[nombreFrontend] = listenersCol[nombreFrontend]||[]).push({cb:cb, errCb:errCb});
          empezarSondeo();
        },
        doc: function(id){
          return {
            set: function(datos){ return llamarEscritura({accion:"guardar", coleccion: claveBackend, id: id, datos: datos}).then(function(r){ sondear(); return r; }); },
            update: function(cambios){ return llamarEscritura({accion:"actualizar", coleccion: claveBackend, id: id, datos: cambios}).then(function(r){ sondear(); return r; }); },
            delete: function(){ return llamarEscritura({accion:"eliminar", coleccion: claveBackend, id: id}).then(function(r){ sondear(); return r; }); }
          };
        },
        add: function(datos){
          var id = idNuevo();
          return llamarEscritura({accion:"guardar", coleccion: claveBackend, id: id, datos: datos}).then(function(){ sondear(); return {id:id}; });
        },
        // varios documentos de esta colección en una sola llamada al backend (ver "Marcar todos
        // no presente" y "Aplicar evento a los seleccionados"): evita que una operación en bloque
        // dispare una llamada HTTP por cada documento, una atrás de la otra
        updateMany: function(cambios){
          if(!cambios || !cambios.length) return Promise.resolve({ok:true, actualizados:0, noEncontrados:[]});
          return llamarEscritura({accion:"actualizarLote", coleccion: claveBackend, cambios: cambios}).then(function(r){ sondear(); return r; });
        }
      };
    }

    function doc(path){
      var info = DOC_BACKEND[path];
      if(!info) throw new Error("Documento desconocido: "+path);
      return {
        onSnapshot: function(cb, errCb){
          (listenersDoc[path] = listenersDoc[path]||[]).push({cb:cb, errCb:errCb});
          empezarSondeo();
        },
        set: function(datos){ return llamarEscritura({accion: info.guardar, datos: datos}).then(function(r){ sondear(); return r; }); }
      };
    }

    return {
      collection: collection,
      doc: doc,
      sesion: function(){ return llamar({accion:"sesion"}); },
      alListo: function(fn){ if(yaAvisoListo) fn(); else listenersListo.push(fn); },
      ultimoError: function(){ return ultimoError; },
      alCambio: function(fn){ listenersCambio.push(fn); },
      sondearAhora: sondear
    };
  }

  // guarda un archivo directo en el navegador (reemplaza al capability "downloads" de Claude,
  // que solo existe adentro del entorno de Artifacts)
  function guardarArchivo(filename, data, mime){
    try{
      var blob = new Blob([data], {type: mime || "text/plain;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = filename;
      document.body.appendChild(enlace);

      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){

      alert("No se pudo generar el archivo para descargar.");
      return false;
    }
  }

  function slugify(s){
    return String(s).toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "x";
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });

  // ---------- geolocalización y exportación ----------
  function capturarUbicacion(latId, lngId, statusId){
    var statusEl = document.getElementById(statusId);
    if(!navigator.geolocation){
      if(statusEl) statusEl.textContent = "Este dispositivo no soporta geolocalización.";
      return;
    }
    if(statusEl) statusEl.textContent = "Obteniendo ubicación…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var latEl = document.getElementById(latId), lngEl = document.getElementById(lngId);
      if(latEl) latEl.value = pos.coords.latitude.toFixed(6);
      if(lngEl) lngEl.value = pos.coords.longitude.toFixed(6);
      if(statusEl) statusEl.textContent = "Ubicación capturada ✓ (±"+Math.round(pos.coords.accuracy||0)+"m)";
    }, function(err){
      if(statusEl) statusEl.textContent = "No se pudo obtener la ubicación ("+(err && err.message ? err.message : "error")+").";
    }, {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  }

  // actualiza el href de un <a target="_blank"> real justo antes de navegar (un window.open()
  // disparado por JS queda atrapado dentro del visor y Google lo bloquea; un link real no)
  function wireLinkMaps(linkId, direccionId, localidadId){
    var a = document.getElementById(linkId);
    if(!a) return;
    var dirEl = document.getElementById(direccionId);
    var locEl = document.getElementById(localidadId);
    function actualizarHref(){
      var dir = dirEl ? dirEl.value.trim() : "";
      var loc = locEl ? locEl.value.trim() : "";
      var q = [dir, loc, "Brandsen", "Buenos Aires"].filter(Boolean).join(", ");
      a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
    }
    // ya arma el link con la dirección que esté cargada al abrir el formulario,
    // sin esperar a que toques el botón — y lo mantiene al día si la seguís editando
    actualizarHref();
    if(dirEl) dirEl.addEventListener("input", actualizarHref);
    if(locEl) locEl.addEventListener("input", actualizarHref);
    a.addEventListener("click", actualizarHref);
  }

  // permite pegar el texto de coordenadas que Google Maps copia al portapapeles ("-35.1469, -58.2303")
  // y completa los campos de latitud/longitud automáticamente
  function wirePegarCoords(inputId, latId, lngId, statusId){
    var el = document.getElementById(inputId);
    if(!el) return;
    el.addEventListener("input", function(){
      var m = el.value.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
      if(!m) return;
      var lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if(isNaN(lat) || isNaN(lng) || Math.abs(lat)>90 || Math.abs(lng)>180) return;
      var latEl = document.getElementById(latId), lngEl = document.getElementById(lngId);
      if(latEl) latEl.value = lat.toFixed(6);
      if(lngEl) lngEl.value = lng.toFixed(6);
      el.value = "";
      var st = document.getElementById(statusId);
      if(st) st.textContent = "Coordenadas cargadas ✓ ("+lat.toFixed(4)+", "+lng.toFixed(4)+")";
    });
  }

  function buildCSV(){
    var geolocalizados = state.servicios.filter(function(s){return s.lat!=null && s.lng!=null;});
    var filas = [["Fecha","HoraLlamado","HoraDespacho","HoraRetorno","Tipo","Evento","Direccion","Localidad","Barrio","Solicitante","Unidades","CantidadPersonal","Latitud","Longitud","Observaciones"]];
    geolocalizados.forEach(function(s){
      filas.push([
        s.fecha||"", s.horaLlamado||"", s.horaDespacho||"", s.horaRetorno||"",
        s.tipo||"", s.evento||"", s.direccion||"", s.localidad||"", s.barrio||"", s.solicitante||"",
        (s.unidades||[]).join(" / "), s.cantidadPersonal||0, s.lat, s.lng, s.observaciones||""
      ]);
    });
    return {csv: filas.map(function(r){ return r.map(csvCampo).join(","); }).join("\r\n"), count: geolocalizados.length};
  }
  // placemark KML de un servicio individual, reutilizado por el export general y por el export de un solo evento
  function placemarkKML(s){
    var desc = [
      s.direccion||"",
      s.fecha? "Fecha: "+fmtFecha(s.fecha) : "",
      s.horaLlamado? "Llamado: "+s.horaLlamado : "",
      s.horaDespacho? "Despacho: "+s.horaDespacho : "",
      (s.unidades && s.unidades.length)? "Unidades: "+s.unidades.join(", ") : "",
      s.observaciones? "Obs: "+s.observaciones : ""
    ].filter(Boolean).join(" | ");
    return '<Placemark><name>'+esc(s.tipo||"Servicio")+'</name><description>'+esc(desc)+'</description>'+
      '<Point><coordinates>'+s.lng+','+s.lat+',0</coordinates></Point></Placemark>';
  }
  function buildKML(){
    var geolocalizados = state.servicios.filter(function(s){return s.lat!=null && s.lng!=null;});
    // se agrupan en carpetas por evento/operativo, para poder tildarlas u ocultarlas en bloque
    // en Google Earth; los servicios individuales van aparte
    var porEvento = {};
    var individuales = [];
    geolocalizados.forEach(function(s){
      if(s.evento){ (porEvento[s.evento] = porEvento[s.evento]||[]).push(s); }
      else individuales.push(s);
    });
    var carpetas = Object.keys(porEvento).sort(function(a,b){return a.localeCompare(b);}).map(function(ev){
      return '<Folder><name>'+esc(ev)+'</name>'+porEvento[ev].map(placemarkKML).join("")+'</Folder>';
    }).join("");
    if(individuales.length){
      carpetas += '<Folder><name>Servicios individuales</name>'+individuales.map(placemarkKML).join("")+'</Folder>';
    }
    var kml = '<?xml version="1.0" encoding="UTF-8"?>'+
      '<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Servicios Gestión de Emergencias Brandsen</name>'+
      carpetas+'</Document></kml>';
    return {kml: kml, count: geolocalizados.length};
  }
  // KML con solo las georreferencias de los servicios de UN evento/operativo puntual
  function buildKMLEvento(nombreEvento){
    var geolocalizados = state.servicios.filter(function(s){ return s.evento===nombreEvento && s.lat!=null && s.lng!=null; });

      geolocalizados.map(placemarkKML).join("")+'</Document></kml>';
    return {kml: kml, count: geolocalizados.length};
  }

  // agrupa en bloque los servicios tildados bajo un mismo evento/operativo, en vez de
  // tener que escribirlo aviso por aviso — quitar=true limpia el campo evento en vez de asignarlo
  function aplicarEventoABloque(quitar){
    if(!state.db) return;
    var ids = Object.keys(state.serviciosSeleccionados).filter(function(id){ return state.serviciosSeleccionados[id]; });
    if(!ids.length){ alert("Tildá al menos un servicio para agrupar."); return; }
    var valor = "";
    if(!quitar){
      var input = document.getElementById("bulkEventoInput");
      valor = input ? input.value.trim() : "";
      if(!valor){ alert("Escribí el nombre del evento u operativo."); return; }
    }
    var btnAplicar = document.getElementById("btnAplicarEventoBulk");
    var btnQuitar = document.getElementById("btnQuitarEventoBulk");
    if(btnAplicar) btnAplicar.setAttribute("disabled","disabled");
    if(btnQuitar) btnQuitar.setAttribute("disabled","disabled");
    var textoBtn = quitar ? btnQuitar : btnAplicar;
    var textoOriginal = textoBtn ? textoBtn.textContent : "";
    if(textoBtn) textoBtn.textContent = "Aplicando…";
    var cambiosEvento = ids.map(function(id){ return {id: id, datos: {evento: valor}}; });
    state.db.collection("servicios").updateMany(cambiosEvento).then(function(resultado){
      var fallidos = (resultado && resultado.noEncontrados) ? resultado.noEncontrados.length : 0;
      state.serviciosSeleccionados = {};
      state.servicioSeleccionMultiple = false;
      state.bulkEventoNombre = ""; state.bulkEventoDesde = ""; state.bulkEventoHasta = "";
      render();
      if(fallidos) alert("No se pudo actualizar "+fallidos+" de "+ids.length+" servicio(s). Probá de nuevo con esos.");
    }).catch(function(e){
      console.error(e);
      render();
      alert("No se pudo aplicar el cambio. Probá de nuevo.");
    });
  }

  // fecha+hora de llamado de un servicio, en formato comparable con un <input type="datetime-local">
  // (si falta la hora de llamado se usa 00:00, para no descartar el servicio solo por eso)
  function fechaHoraServicio(s){
    if(!s.fecha) return "";
    return s.fecha+"T"+(s.horaLlamado||"00:00");
  }

  // tilda (sumándose a lo ya tildado a mano) todos los servicios cuya fecha y hora de llamado caen
  // dentro del rango elegido, reflejándolo directo en el DOM para no perder lo que se esté tipeando
  // en el formulario de "Nuevo aviso"
  function marcarServiciosPorRango(){
    var desde = state.bulkEventoDesde, hasta = state.bulkEventoHasta;
    if(!desde && !hasta){ alert("Elegí al menos el inicio o el fin del evento."); return; }
    var encontrados = 0;
    state.servicios.forEach(function(s){
      var fh = fechaHoraServicio(s);
      if(!fh) return;
      if(desde && fh < desde) return;
      if(hasta && fh > hasta) return;
      state.serviciosSeleccionados[s.id] = true;
      encontrados++;
      var chk = document.querySelector('[data-seleccionar-servicio="'+String(s.id).replace(/"/g,'\\"')+'"]');
      if(chk){
        chk.checked = true;
        var card = chk.closest(".svc");
        if(card) card.classList.add("seleccionado");
      }
    });
    if(!encontrados){ alert("No hay servicios con fecha y hora en ese rango."); return; }
    actualizarContadorSeleccion();
  }

  function fmtFecha(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
  }
  function fmtHora(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }
  // convierte un horaRetorno guardado (puede ser "HH:MM" o, en registros viejos,
  // una fecha/hora completa) al formato "HH:MM" que necesita un <input type="time">
  function horaInputValue(v){
    if(!v) return "";
    if(v.indexOf("T")===-1) return v;
    var d = new Date(v);
    if(isNaN(d)) return "";
    var hh = String(d.getHours()).padStart(2,"0");
    var mm = String(d.getMinutes()).padStart(2,"0");
    return hh+":"+mm;
  }

  // se guarda para no perder el scroll cuando algo (un toggle, o una sincronización en
  // vivo de otro dispositivo) fuerza un re-render mientras seguís en la misma pestaña —
  // por ejemplo, tildar "Presente" en una nómina larga no debe mandarte de vuelta arriba.
  // Se guarda tanto el scroll del panel principal como el de la ventana/documento, porque
  // según el navegador (sobre todo en celulares) uno u otro es el que realmente se mueve.
  var ultimaTabRenderizada = null;
  function leerScroll(mainEl){
    return {
      main: mainEl ? mainEl.scrollTop : 0,
      win: window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0
    };
  }
  function aplicarScroll(mainEl, pos){
    if(mainEl) mainEl.scrollTop = pos.main;
    window.scrollTo(0, pos.win);
    document.documentElement.scrollTop = pos.win;
    document.body.scrollTop = pos.win;
  }

  // pantalla de acceso: pide el token personal/de centro y lo valida contra el backend
  function loginScreenHTML(){
    return '<div class="card" style="max-width:380px;margin:60px auto;">'+
      '<div class="section-head" style="margin-bottom:6px;"><h2>Acceso al Sistema de Gestión de Emergencias</h2></div>'+
      '<p class="sub" style="margin:0 0 14px;">Ingresá tu código de acceso personal. Si no lo tenés, pedíselo a tu oficial a cargo.</p>'+

  function wireLogin(){
    var form = document.getElementById("formLogin");
    if(!form) return;
    var input = document.getElementById("tokenInput");
    if(input && !state.sesionVerificando) input.focus();
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var val = input ? input.value.trim() : "";
      if(!val){ state.sesionError = "Ingresá tu código de acceso."; render(); return; }
      iniciarSesion(val, false);
    });
  }

  function esAdmin(){ return !!(state.sesion && state.sesion.rol === "admin"); }

  // valida el token contra el backend; silencioso=true es el intento automático con la
  // sesión guardada en este navegador al abrir la app (no muestra error si falla, solo
  // vuelve a pedir el código)
  function iniciarSesion(token, silencioso){
    state.sesionVerificando = true; state.sesionError = ""; render();
    var dbNuevo = crearDBremota(URL_BACKEND, token);
    dbNuevo.sesion().then(function(resp){
      state.sesion = {token: token, rol: resp.rol, alcance: resp.alcance, nombre: resp.nombre};
      try{ localStorage.setItem(CLAVE_SESION_LOCAL, JSON.stringify(state.sesion)); }catch(e){}
      state.db = dbNuevo;
      state.sesionVerificando = false;
      arrancarDatos();
    }).catch(function(e){
      state.sesionVerificando = false;
      if(silencioso){
        try{ localStorage.removeItem(CLAVE_SESION_LOCAL); }catch(e2){}
      } else {
        state.sesionError = (e && e.message) ? e.message : "No se pudo verificar el acceso.";
      }
      render();
    });
  }

  function cerrarSesion(){
    try{ localStorage.removeItem(CLAVE_SESION_LOCAL); }catch(e){}
    state.sesion = null; state.db = null; state.ready = false;
    state.unidades=[]; state.servicios=[]; state.personal=[]; state.centros=[]; state.ingresosDirectos=[];
    state.rioLecturas=[]; state.riesgoLocalidades=[]; state.helipuertos=[]; state.contactos=[]; state.bitacoraEventos=[];
    render();
  }

  function actualizarBarraSesion(){
    var el = document.getElementById("sesionPill");
    if(!el) return;
    if(!state.sesion){ el.style.display = "none"; return; }
    el.style.display = "";
    el.innerHTML = '<span>'+esc(state.sesion.nombre || (esAdmin()?"Administración":"Centro"))+'</span>'+
      '<button type="button" id="btnCerrarSesion" class="btn-mini ghost" style="margin-left:8px;">Cerrar sesión</button>';
    var btn = document.getElementById("btnCerrarSesion");
    if(btn) btn.addEventListener("click", cerrarSesion);
  }

  function render(){
    var root = document.getElementById("view");
    actualizarBarraSesion();
    if(!state.sesion){ root.innerHTML = loginScreenHTML(); wireLogin(); return; }
    var mainEl = document.querySelector("main");
    var mismaTab = (state.tab === ultimaTabRenderizada);
    var scrollGuardado = mismaTab ? leerScroll(mainEl) : null;
    if(!state.ready){
      var errorCarga = state.db && state.db.ultimoError ? state.db.ultimoError() : null;
      if(errorCarga){
        root.innerHTML = '<div class="empty">No se pudo conectar con los datos.<br><span class="sub">'+esc(errorCarga)+'</span><br><button type="button" class="btn primary small" id="btnReintentarCarga" style="margin-top:10px;">Reintentar</button></div>';
        var btnReintentarCarga = document.getElementById("btnReintentarCarga");
        if(btnReintentarCarga) btnReintentarCarga.addEventListener("click", function(){ state.db.sondearAhora(); });
      } else {
        root.innerHTML = '<div class="empty">Cargando datos en vivo…</div>';
      }
      ultimaTabRenderizada = null;
      return;
    }
    if(state.tab==="tablero") root.innerHTML = viewTablero();
    else if(state.tab==="servicios") root.innerHTML = viewServicios();
    else if(state.tab==="personal") root.innerHTML = viewPersonal();
    else if(state.tab==="centros") root.innerHTML = viewCentros();
    else if(state.tab==="situacion") root.innerHTML = viewSituacion();
    else root.innerHTML = viewReportes();
    wireView();
    renderNav();
    if(scrollGuardado){
      aplicarScroll(mainEl, scrollGuardado);
      // algunos navegadores (sobre todo en celulares) recién terminan el reflow después
      // de este mismo ciclo; se refuerza una vez más en el próximo frame por las dudas
      requestAnimationFrame(function(){ aplicarScroll(document.querySelector("main"), scrollGuardado); });
    }
    ultimaTabRenderizada = state.tab;
  }

  function renderNav(){
    var navSideEl = document.getElementById("navSide");

    if(!esAdmin()){
      navSideEl.innerHTML = ""; navMobileEl.innerHTML = "";

    }
    var activos = state.servicios.filter(function(s){return s.activo;}).length;
    function itemsHTML(mobile){
      return TABS.map(function(t){
        var badge = (t.id==="tablero" && activos>0) ? '<span class="count">'+activos+'</span>' : "";
        return '<button data-tab="'+t.id+'" class="'+(state.tab===t.id?"active":"")+'">'+
          '<span>'+t.label+'</span>'+badge+'</button>';
      }).join("");
    }
    navSideEl.innerHTML = itemsHTML(false);
    navMobileEl.innerHTML = itemsHTML(true);
    Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function(b){
      b.addEventListener("click", function(){ state.tab = b.getAttribute("data-tab"); render(); });
    });
  }

    var presentes = state.personal.filter(function(p){return p.presente;}).length;
    var jerarquicos = state.personal.filter(function(p){return p.jerarquico;}).length;
    var choferes = state.personal.filter(function(p){return p.chofer;}).length;
    var reservistas = state.personal.filter(function(p){return p.reserva;}).length;
    var operando = state.servicios.filter(function(s){return s.activo;})
      .reduce(function(sum,s){ return sum + (Number(s.cantidadPersonal)||0); }, 0);
    var disponible = Math.max(0, presentes - operando);
    // desglose de jerárquicos/choferes SOLO entre los disponibles (presentes y sin asignar a
    // ningún servicio activo en este momento) — se usa en el tablero, no reemplaza al total
    // de la nómina que se sigue mostrando en la pestaña Personal
    var busy = personalOcupadoOtroServicio(null);
    var disponiblesLista = state.personal.filter(function(p){ return p.presente && !busy[p.id]; });
    var jerarquicosDisponibles = disponiblesLista.filter(function(p){return p.jerarquico;}).length;
    var choferesDisponibles = disponiblesLista.filter(function(p){return p.chofer;}).length;
    return {
      total:total, presentes:presentes, jerarquicos:jerarquicos, choferes:choferes, reservistas:reservistas,
      operando:operando, disponible:disponible,
      jerarquicosDisponibles:jerarquicosDisponibles, choferesDisponibles:choferesDisponibles
    };
  }

    if(!s.activo) return "cerrado";
    if(!s.unidades || !s.unidades.length) return "pendiente";

  // ---------- personal por unidad (trazabilidad de quién fue en cada unidad) ----------
  function personalPorUnidadHTML(s){
    if(!s.personalPorUnidad) return "";
    var lines = Object.keys(s.personalPorUnidad).map(function(u){
      var ids = s.personalPorUnidad[u]||[];
      if(!ids.length) return "";
      var nombres = ids.map(function(id){
        var p = state.personal.filter(function(x){return x.id===id;})[0];
        return p? p.nombre : id;
      }).join(", ");
      return '<div style="font-size:12.5px;color:var(--text-muted);"><b style="color:var(--text);">'+esc(u)+':</b> '+esc(nombres)+'</div>';
    }).filter(Boolean).join("");
    if(!lines) return "";
    return '<div class="obs" style="display:flex;flex-direction:column;gap:3px;">'+lines+'</div>';
  }

  function totalPersonalSel(selMap){
    var set = {};
    Object.keys(selMap||{}).forEach(function(u){
      (selMap[u]||[]).forEach(function(dni){ set[dni] = true; });
    });
    return Object.keys(set).length;
  }

  // personal ya afectado a OTRO servicio activo (distinto del que se está editando; si no se
  // pasa excludeId no se excluye ninguno — caso del aviso nuevo, que todavía no tiene id propio)
  function personalOcupadoOtroServicio(excludeId){
    if(excludeId === undefined) excludeId = state.editingServicioId;
    var busy = {};
    state.servicios.forEach(function(sv){
      if(excludeId!=null && sv.id === excludeId) return;
      if(!sv.activo || !sv.personalPorUnidad) return;
      Object.keys(sv.personalPorUnidad).forEach(function(u){
        (sv.personalPorUnidad[u]||[]).forEach(function(dni){ busy[dni] = sv; });
      });
    });
    return busy;
  }

  // el personal de Brandsen presta servicio en Cuartel Central; el de Jeppener, en el
  // Destacamento N.° 1 Jeppener — no es excluyente (puede cruzarse), pero agrupar así agiliza
  // la búsqueda porque casi siempre se busca dentro de la propia zona
  var ESTACIONES = [
    {key:"central", label:"Cuartel Central"},
    {key:"jeppener", label:"Destacamento N.° 1 Jeppener"}
  ];
  function estacionDe(p){
    var loc = (p.localidad||"").toLowerCase();
    return loc.indexOf("jeppener") > -1 ? "jeppener" : "central";
  }
  // orden de los grupos: por defecto Central primero (Brandsen), salvo que el servicio
  // sea en Jeppener — ahí conviene ver primero a la gente de esa zona para cargar más rápido
  function estacionesOrdenadas(localidadServicio){
    var loc = (localidadServicio||"").toLowerCase();
    if(loc.indexOf("jeppener") > -1) return [ESTACIONES[1], ESTACIONES[0]];
    return ESTACIONES;
  }

  function personalPickerHTML(unidades, selMap, excludeServicioId, localidadServicio){
    if(!unidades.length){
      return '<div class="sub" style="font-size:12.5px;color:var(--text-muted);">Elegí al menos una unidad para poder tildar quién va en cada una.</div>';
    }
    var ocupadoOtroServicio = personalOcupadoOtroServicio(excludeServicioId);
    var ordenEstaciones = estacionesOrdenadas(localidadServicio);
    return unidades.map(function(u){
      var sel = (selMap[u]||[]);
      var presentes = state.personal.filter(function(p){return p.presente;});
      var lista = (presentes.length? presentes : state.personal.slice()).slice();
      function chipDe(p){
        var on = sel.indexOf(p.id) > -1;
        var otroServ = !on ? ocupadoOtroServicio[p.id] : null;
        var otraUnidad = null;
        if(!on && !otroServ){
          Object.keys(selMap).forEach(function(uu){
            if(uu!==u && (selMap[uu]||[]).indexOf(p.id)>-1) otraUnidad = uu;
          });
        }
        if(otroServ){
          return '<button type="button" class="toggle-chip small busy" disabled title="Ya está afectado a: '+esc(otroServ.tipo||"otro servicio")+' — '+esc(otroServ.direccion||"")+'">'+esc(p.nombre)+'</button>';
        }
        if(otraUnidad){
          return '<button type="button" class="toggle-chip small busy" disabled title="Ya está asignado a la unidad '+esc(otraUnidad)+' en este mismo servicio">'+esc(p.nombre)+'</button>';
        }
        return '<button type="button" class="toggle-chip small '+(on?"on":"")+'" data-toggle-personal data-punidad="'+esc(u)+'" data-pdni="'+esc(p.id)+'">'+esc(p.nombre)+'</button>';
      }
      var grupos = ordenEstaciones.map(function(est){
        var deEstacion = lista.filter(function(p){return estacionDe(p)===est.key;})
          .sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
        if(!deEstacion.length) return "";
        return '<div class="personal-picker-grupo">'+
          '<div class="personal-picker-grupo-label">'+esc(est.label)+' <span style="font-weight:400;">('+deEstacion.length+')</span></div>'+
          '<div class="toggle-group personal-picker">'+deEstacion.map(chipDe).join("")+'</div>'+
        '</div>';
      }).join("");
      return '<div style="margin-bottom:10px;">'+
        '<div class="l" style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;">'+
          'Personal — Unidad '+esc(u)+' (<span data-pcount="'+esc(u)+'">'+sel.length+'</span>)'+
        '</div>'+
        (grupos || '<span class="sub" style="font-size:12px;color:var(--text-muted);">No hay personal presente cargado.</span>')+
      '</div>';
    }).join("");
  }

  function wirePersonalPicker(container, selMap, totalInputId){
    if(!container) return;
    selMap = selMap || state.editPersonalSel;
    totalInputId = totalInputId || "es_personal";
    Array.prototype.forEach.call(container.querySelectorAll("[data-toggle-personal]"), function(btn){
      btn.addEventListener("click", function(){
        var u = btn.getAttribute("data-punidad");
        var dni = btn.getAttribute("data-pdni");
        if(!selMap[u]) selMap[u] = [];
        var arr = selMap[u];
        var i = arr.indexOf(dni);
        if(i>-1) arr.splice(i,1); else arr.push(dni);
        btn.classList.toggle("on");
        var count = container.querySelector('[data-pcount="'+u.replace(/"/g,'\\"')+'"]');
        if(count) count.textContent = arr.length;
        var totalInput = document.getElementById(totalInputId);
        if(totalInput) totalInput.value = totalPersonalSel(selMap);
      });
    });
  }

  // ---------- detalle de evacuados (mayores/menores) por servicio ----------
  // prefix "f" = formulario de alta (nuevo aviso), "es" = formulario de edición
  function evacArr(prefix, tipo){
    if(prefix==="es") return tipo==="mayor" ? state.editEvacMayores : state.editEvacMenores;
    if(prefix==="ic") return tipo==="mayor" ? state.icEvacMayores : state.icEvacMenores;
    return tipo==="mayor" ? state.formEvacMayores : state.formEvacMenores;
  }

  function evacuadosRowsHTML(prefix, tipo){
    var lista = evacArr(prefix, tipo);
    if(!lista.length){
      return '<div class="sub" style="margin:4px 0 0;">Sin '+(tipo==="mayor"?"mayores":"menores")+' cargados todavía.</div>';
    }
    return lista.map(function(item, i){
      var idBase = prefix+"_evac"+tipo+"_"+i;
      return '<div class="row-actions" style="margin-top:6px;align-items:end;">'+
        '<div class="field" style="flex:2;min-width:150px;"><label>Apellido y nombre</label><input class="mini-input" id="'+idBase+'_nombre" value="'+esc(item.nombre||"")+'"></div>'+
        '<div class="field" style="flex:1;min-width:100px;"><label>DNI</label><input class="mini-input" id="'+idBase+'_dni" value="'+esc(item.dni||"")+'"></div>'+
        (tipo==="mayor"? '<div class="field" style="flex:1;min-width:110px;"><label>Teléfono</label><input class="mini-input" id="'+idBase+'_telefono" value="'+esc(item.telefono||"")+'"></div>' : '')+
        (tipo==="mayor"? '<div class="field" style="flex:2;min-width:150px;"><label>Dirección</label><input class="mini-input" id="'+idBase+'_direccion" value="'+esc(item.direccion||"")+'"></div>' : '')+
        '<button type="button" class="btn-mini ghost" data-evac-quitar="'+prefix+':'+tipo+':'+i+'">Quitar</button>'+
      '</div>';
    }).join("");
  }

  function evacuadosSeccionHTML(prefix){
    var total = evacArr(prefix,"mayor").length + evacArr(prefix,"menor").length;
    return '<div class="field" style="margin-top:12px;">'+
      '<details'+(total? ' open':'')+'>'+
        '<summary style="cursor:pointer;font-weight:700;font-size:12.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;">Detalle de evacuados (opcional)'+(total? ' — '+total+' cargados':'')+'</summary>'+
        '<div style="margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:8px;">'+
          '<div class="sub" style="font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--text-muted);">Mayores</div>'+
          '<div id="'+prefix+'_evacmayor_lista">'+evacuadosRowsHTML(prefix,"mayor")+'</div>'+
          '<button type="button" class="btn ghost small" style="margin-top:8px;" data-evac-agregar="'+prefix+':mayor">+ Agregar mayor</button>'+
          '<div class="sub" style="font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--text-muted);margin-top:14px;">Menores</div>'+
          '<div id="'+prefix+'_evacmenor_lista">'+evacuadosRowsHTML(prefix,"menor")+'</div>'+
          '<button type="button" class="btn ghost small" style="margin-top:8px;" data-evac-agregar="'+prefix+':menor">+ Agregar menor</button>'+
        '</div>'+
      '</details>'+
    '</div>';
  }

  // antes de agregar/quitar una fila, traemos a state lo que ya se tipeó en el DOM
  // para no perderlo (misma idea que con el resto de los formularios)
  function sincronizarEvacuadosDesdeDOM(prefix){
    ["mayor","menor"].forEach(function(tipo){
      evacArr(prefix, tipo).forEach(function(item, i){
        var idBase = prefix+"_evac"+tipo+"_"+i;
        var nombreEl = document.getElementById(idBase+"_nombre");
        var dniEl = document.getElementById(idBase+"_dni");
        if(nombreEl) item.nombre = nombreEl.value;
        if(dniEl) item.dni = dniEl.value;
        if(tipo==="mayor"){
          var telEl = document.getElementById(idBase+"_telefono");
          if(telEl) item.telefono = telEl.value;
          var dirEl2 = document.getElementById(idBase+"_direccion");
          if(dirEl2) item.direccion = dirEl2.value;
        }
      });
    });
  }

  function refrescarEvacuados(prefix){
    var contM = document.getElementById(prefix+"_evacmayor_lista");
    if(contM) contM.innerHTML = evacuadosRowsHTML(prefix,"mayor");
    var contN = document.getElementById(prefix+"_evacmenor_lista");
    if(contN) contN.innerHTML = evacuadosRowsHTML(prefix,"menor");
    // la cantidad de mayores/menores se completa sola con lo cargado acá, igual que "cantidad de personal"
    var campoMayores = document.getElementById(prefix+"_mayores");
    if(campoMayores) campoMayores.value = evacArr(prefix,"mayor").length;
    var campoMenores = document.getElementById(prefix+"_menores");
    if(campoMenores) campoMenores.value = evacArr(prefix,"menor").length;
    wireEvacuadosQuitar(prefix);
  }

  function wireEvacuadosQuitar(prefix){
    ["mayor","menor"].forEach(function(tipo){
      var cont = document.getElementById(prefix+"_evac"+tipo+"_lista");
      if(!cont) return;
      Array.prototype.forEach.call(cont.querySelectorAll("[data-evac-quitar]"), function(btn){
        btn.addEventListener("click", function(){
          var partes = btn.getAttribute("data-evac-quitar").split(":");
          sincronizarEvacuadosDesdeDOM(prefix);
          evacArr(prefix, partes[1]).splice(Number(partes[2]),1);
          refrescarEvacuados(prefix);
        });
      });
    });
  }

  // los botones "+ Agregar" no se destruyen entre refrescos (solo las filas sí), así que
  // se cablean una sola vez desde wireView() — cablearlos de nuevo duplicaría el alta de filas
  function wireEvacuadosAgregar(prefix){
    Array.prototype.forEach.call(document.querySelectorAll('[data-evac-agregar^="'+prefix+':"]'), function(btn){
      btn.addEventListener("click", function(){
        var tipo = btn.getAttribute("data-evac-agregar").split(":")[1];
        sincronizarEvacuadosDesdeDOM(prefix);
        evacArr(prefix, tipo).push(tipo==="mayor" ? {nombre:"",dni:"",telefono:"",direccion:""} : {nombre:"",dni:""});
        refrescarEvacuados(prefix);
      });
    });
  }

  // arma lo que se guarda en el servicio, leyendo directo del DOM (por si la última fila
  // tipeada todavía no pasó por sincronizarEvacuadosDesdeDOM) y descartando filas vacías
  function leerEvacuadosParaGuardar(prefix){
    function leer(tipo){
      return evacArr(prefix, tipo).map(function(_, i){
        var idBase = prefix+"_evac"+tipo+"_"+i;
        var nombreEl = document.getElementById(idBase+"_nombre");
        var dniEl = document.getElementById(idBase+"_dni");
        var item = {
          nombre: nombreEl ? nombreEl.value.trim() : "",
          dni: dniEl ? dniEl.value.trim() : ""
        };
        if(tipo==="mayor"){
          var telEl = document.getElementById(idBase+"_telefono");
          item.telefono = telEl ? telEl.value.trim() : "";
          var dirEl2 = document.getElementById(idBase+"_direccion");
          item.direccion = dirEl2 ? dirEl2.value.trim() : "";
        }
        return item;
      }).filter(function(x){ return x.nombre || x.dni; });
    }
    return { mayores: leer("mayor"), menores: leer("menor") };
  }

  // ---------- unidades del formulario de edición (con reasignación desde otro servicio) ----------
  function unidadesPorGrupoHTML(selUnidades, servicioIdActual){
    var busyByUnit = activeByUnit();
    return GRUPOS_UNIDAD.map(function(g){
      var us = state.unidades.filter(function(u){return u.grupo===g;});
      if(!us.length) return "";
      var chips = us.map(function(u){
        var on = selUnidades.indexOf(u.numero) > -1;
        var ocupante = busyByUnit[u.numero];
        // si ya la sumamos a este formulario (por ejemplo recién reasignada) no la mostramos como
        // ocupada aunque la base todavía no haya confirmado que se liberó del servicio de origen
        var busy = ocupante && ocupante.id !== servicioIdActual && !on;
        if(busy){
          var confirmando = state.confirmandoReasignacion && state.confirmandoReasignacion.unidad===u.numero;
          if(confirmando){
            var nombresConf = ((ocupante.personalPorUnidad && ocupante.personalPorUnidad[u.numero]) || []).map(function(dni){
              var p = state.personal.filter(function(x){return x.id===dni;})[0];
              return p ? p.nombre : dni;
            });
            return '<span class="reasignar-confirm">'+
              '¿Reasignar '+esc(u.numero)+(nombresConf.length?' (con '+esc(nombresConf.join(", "))+')':'')+' desde "'+esc(ocupante.tipo||"otro servicio")+' — '+esc(ocupante.direccion||"")+'"?'+
              ' <button type="button" class="btn-mini" data-confirmar-reasignar="'+esc(u.numero)+'" data-confirmar-origen="'+esc(ocupante.id)+'">Sí, reasignar</button>'+
              ' <button type="button" class="btn-mini ghost" data-cancelar-reasignar="'+esc(u.numero)+'">Cancelar</button>'+
              '</span>';
          }
          return '<button type="button" class="toggle-chip busy" data-reasignar-unidad="'+esc(u.numero)+'" data-reasignar-origen="'+esc(ocupante.id)+'" title="En servicio: '+esc(ocupante.tipo||"otro servicio")+' — '+esc(ocupante.direccion||"")+'. Tocá para reasignarla acá (con su personal), sin pasar por base.">'+esc(u.numero)+' ⇄</button>';
        }
        return '<button type="button" class="toggle-chip '+(on?"on":"")+'" data-edit-unidad="'+esc(u.numero)+'">'+esc(u.numero)+'</button>';
      }).join("");
      return '<div style="margin-bottom:6px;"><div class="l" style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;">'+g+'</div><div class="toggle-group">'+chips+'</div></div>';
    }).join("");
  }

  function wireUnidadChips(container){
    if(!container) return;
    Array.prototype.forEach.call(container.querySelectorAll("[data-edit-unidad]"), function(btn){
      btn.addEventListener("click", function(){
        var u = btn.getAttribute("data-edit-unidad");
        var i = state.editUnidadesSel.indexOf(u);
        if(i>-1) state.editUnidadesSel.splice(i,1); else state.editUnidadesSel.push(u);
        // no volvemos a renderizar toda la vista: perdería lo que ya se escribió en el resto del formulario
        btn.classList.toggle("on");

  // mueve una unidad (y el personal que ya tenía tildado) desde el servicio donde está ahora
  // a este formulario, sin pasar por "marcar retorno" — para el caso de reasignación entre siniestros
  // (la confirmación ya se hizo en línea, en el propio chip — ver unidadesPorGrupoHTML)
  function ejecutarReasignacion(unidadNumero, origenId){
    if(!state.db) return;
    var origen = state.servicios.filter(function(x){return x.id===origenId;})[0];
    if(!origen) return;
    var personalDeEsaUnidad = (origen.personalPorUnidad && origen.personalPorUnidad[unidadNumero]) || [];

    // actualización local inmediata de este formulario, sin esperar la vuelta del servidor
    if(state.editUnidadesSel.indexOf(unidadNumero)===-1) state.editUnidadesSel.push(unidadNumero);
    state.editPersonalSel[unidadNumero] = personalDeEsaUnidad.slice();
    var esObs = document.getElementById("es_obs");
    if(esObs){
      var nota = "Unidad "+unidadNumero+" reasignada desde otro servicio ("+(origen.tipo||"")+" — "+(origen.direccion||"")+").";
      esObs.value = esObs.value ? esObs.value+"\n"+nota : nota;
    }
    refrescarUnidadesYPersonalForm();

    // liberamos la unidad (y su personal) del servicio de origen
    var nuevasUnidadesOrigen = (origen.unidades||[]).filter(function(x){return x!==unidadNumero;});
    var patchOrigen = {unidades: nuevasUnidadesOrigen};
    if(origen.personalPorUnidad && origen.personalPorUnidad[unidadNumero]){
      var nuevoPPU = Object.assign({}, origen.personalPorUnidad);
      delete nuevoPPU[unidadNumero];
      patchOrigen.personalPorUnidad = nuevoPPU;
    }
    var horaNota = new Date().toTimeString().slice(0,5);
    var notaCierre = "";
    // si era la única unidad de ese servicio, no queda nada trabajando ahí: se cierra solo
    // (no queda "pendiente de despacho", que es para avisos nuevos sin unidades asignadas todavía)
    if(!nuevasUnidadesOrigen.length){
      patchOrigen.activo = false;
      patchOrigen.horaRetorno = new Date().toTimeString().slice(0,5);
      notaCierre = "\nServicio cerrado automáticamente: se quedó sin unidades asignadas.";
    }
    patchOrigen.observaciones = (origen.observaciones ? origen.observaciones+"\n" : "") +
      "Unidad "+unidadNumero+" reasignada a otro servicio a las "+horaNota+"."+notaCierre;
    state.db.collection("servicios").doc(origenId).update(patchOrigen).catch(function(e){
      console.error(e); alert("No se pudo liberar la unidad del servicio anterior. Probá de nuevo o avisá por radio.");
    });
  }

  function partirClave(clave){
    var tipo = clave.split(":")[0];
    return { tipo: tipo, id: clave.slice(tipo.length+1) };
  }

  function refrescarConfirmBox(clave){
    var p = partirClave(clave);
    var def = ACCIONES_CONFIRMABLES[p.tipo];
    if(!def) return;
    var box = document.getElementById(def.boxId(p.id));
    if(box){ box.innerHTML = def.render(p.id); wireConfirmaciones(box); }
  }

  function wireConfirmaciones(root){
    if(!root) return;
    Array.prototype.forEach.call(root.querySelectorAll("[data-pedir-confirmacion]"), function(btn){
      btn.addEventListener("click", function(){
        var clave = btn.getAttribute("data-pedir-confirmacion");
        state.confirmAccion = clave;
        refrescarConfirmBox(clave);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-cancelar-accion]"), function(btn){
      btn.addEventListener("click", function(){
        var clave = btn.getAttribute("data-cancelar-accion");
        state.confirmAccion = null;
        refrescarConfirmBox(clave);
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-confirmar-accion]"), function(btn){
      btn.addEventListener("click", function(){
        var clave = btn.getAttribute("data-confirmar-accion");
        var p = partirClave(clave);
        var def = ACCIONES_CONFIRMABLES[p.tipo];
        if(!def) return;
        def.ejecutar(p.id, btn);
      });
    });
  }

  // evacuados que fueron derivados a un centro, acumulados a partir de dos fuentes:
  // 1) los servicios (avisos de bomberos) que lo tienen cargado como "Centro de evacuación",
  // 2) los ingresos directos: gente que llegó por sus propios medios o la trajo un particular,
  //    sin que haya un servicio/despacho de por medio, cargados directo desde el centro.
  // Cada fila puede marcarse como "retirada del centro" en bloque (retiradoDelCentro), y cada
  // evacuado con nombre cargado puede marcarse retirado individualmente (campo "retirado" en
  // su detalle); lo que no tiene nombre cargado sigue la marca en bloque de la fila.
  function evacuadosDelCentro(nombreCentro){
    var servicios = state.servicios.filter(function(s){ return s.centroEvacuacion === nombreCentro; })
      .map(function(s){
        return { origen:"servicio", id: s.id, orden: fechaHoraOrdenable(s),
          etiqueta: esc(fmtFecha(s.fecha)||"s/fecha")+'</b> — '+esc(s.direccion||s.tipo||""),
          mayores: Number(s.mayores)||0, menores: Number(s.menores)||0,
          mayoresDetalle: s.evacuadosMayoresDetalle||[], menoresDetalle: s.evacuadosMenoresDetalle||[],
          retiradoTodo: !!s.retiradoDelCentro };
      });
    var directos = state.ingresosDirectos.filter(function(d){ return d.centro === nombreCentro; })
      .map(function(d){
        return { origen:"directo", id: d.id, orden: (d.fecha||"")+"T"+(d.hora||"00:00"),
          etiqueta: esc(fmtFecha(d.fecha)||"s/fecha")+'</b> — '+esc(d.tipoIngreso||"Ingreso directo")+(d.evento?' ('+esc(d.evento)+')':''),
          mayores: Number(d.mayores)||0, menores: Number(d.menores)||0,
          mayoresDetalle: d.evacuadosMayoresDetalle||[], menoresDetalle: d.evacuadosMenoresDetalle||[],
          retiradoTodo: !!d.retiradoDelCentro };
      });
    var todas = servicios.concat(directos).sort(function(a,b){ return a.orden.localeCompare(b.orden); });
    var totalMayores = 0, totalMenores = 0, activosMayores = 0, activosMenores = 0;
    var filas = todas.map(function(f){
      var actMay, actMen;
      if(f.retiradoTodo){
        actMay = 0; actMen = 0;
      }else{
        var nombradosActivosMay = f.mayoresDetalle.filter(function(e){ return !e.retirado; }).length;
        var sinNombreMay = Math.max(0, f.mayores - f.mayoresDetalle.length);
        actMay = nombradosActivosMay + sinNombreMay;
        var nombradosActivosMen = f.menoresDetalle.filter(function(e){ return !e.retirado; }).length;
        var sinNombreMen = Math.max(0, f.menores - f.menoresDetalle.length);
        actMen = nombradosActivosMen + sinNombreMen;
      }
      totalMayores += f.mayores; totalMenores += f.menores;
      activosMayores += actMay; activosMenores += actMen;
      f.activosMayores = actMay; f.activosMenores = actMen;
      return f;
    });
    return {
      totalMayores: totalMayores, totalMenores: totalMenores,
      activosMayores: activosMayores, activosMenores: activosMenores, filas: filas
    };
  }

  // total de evacuados alojados actualmente, sumando todos los centros
  function evacuadosActivosTotalGeneral(){
    var mayores = 0, menores = 0;
    state.centros.forEach(function(c){
      var e = evacuadosDelCentro(c.nombre);
      mayores += e.activosMayores; menores += e.activosMenores;
    });
    return {mayores: mayores, menores: menores, total: mayores+menores};
  }

  // tarjeta compacta para el tablero, con el desglose por centro (no solo el total) —
  // solo aparece si hay algún evacuado alojado en este momento, para no sumar ruido
  // cuando no hay nada que mostrar
  // alertas automáticas del tablero: unidades disponibles bajas, centros de evacuación cerca
  // o por encima de su capacidad, río en estado Alerta/Alarma. Solo devuelve lo que aplica en
  // este momento, para no mostrar nada cuando no hay nada que avisar
  function alertasActivas(){
    var alertas = [];
    var busy = activeByUnit();
    var totalUnidades = state.unidades.length;
    var disponibles = state.unidades.filter(function(u){ return !busy[u.numero]; }).length;
    if(totalUnidades>0){
      if(disponibles===0){
        alertas.push({texto:"No queda ninguna unidad disponible.", cls:"danger"});
      }else if(totalUnidades>=4 && disponibles <= Math.ceil(totalUnidades*0.25)){
        alertas.push({texto:"Quedan solo "+disponibles+" de "+totalUnidades+" unidades disponibles.", cls:"warn"});
      }
    }
    state.centros.forEach(function(c){
      var cap = Number(c.capacidad)||0;
      if(!cap) return;
      var e = evacuadosDelCentro(c.nombre);
      var activos = e.activosMayores + e.activosMenores;
      if(activos >= cap){
        alertas.push({texto:'Centro "'+c.nombre+'" superó su capacidad ('+activos+'/'+cap+').', cls:"danger"});
      }else if(activos >= cap*0.9){
        alertas.push({texto:'Centro "'+c.nombre+'" está cerca de su capacidad ('+activos+'/'+cap+').', cls:"warn"});
      }
    });
    var ultima = ultimaLecturaRio();
    if(ultima){
      var crec = crecidaRio(ultima.distanciaMedida, state.pronostico.distanciaNormalCauce);
      var niv = nivelRio(crec, state.pronostico.umbralAlerta, state.pronostico.umbralAlarma);
      if(niv.estado==="ALARMA" || niv.estado==="ALERTA"){
        alertas.push({texto:"Río en estado "+niv.estado+" (crecida "+(crec>=0?"+":"")+crec.toFixed(2)+" m sobre el cauce normal).", cls: niv.cls});
      }
    }
    return alertas;
  }

  function toggleRetiroEvacuado(origen, id, tipo, idx){
    if(!state.db) return;

  // ---------- Situación: monitoreo hidrológico, riesgo por localidad, helipuertos, contactos ----------
  var NIVELES_RIESGO = ["Bajo","Medio","Alto"];

  // metodología de la planilla original: se mide la distancia (Hc) desde un punto fijo
  // (ej. baranda de un puente) hasta el espejo de agua; la "distancia normal del cauce"
  // (Hn) es esa misma medida en condición normal. La crecida sobre el cauce normal es
  // Hn - Hc (a menor distancia medida, más subió el agua).
  function crecidaRio(distanciaMedida, distanciaNormal){
    if(distanciaNormal===""||distanciaNormal==null||distanciaMedida===""||distanciaMedida==null||isNaN(Number(distanciaMedida))) return null;
    return Number(distanciaNormal) - Number(distanciaMedida);
  }

  // estado derivado de una crecida (m sobre el cauce normal) contra los umbrales
  // configurados (si no hay umbrales cargados todavía, no se puede calcular estado)
  function nivelRio(crecida, umbralAlerta, umbralAlarma){
    var ua = umbralAlerta!==""&&umbralAlerta!=null ? Number(umbralAlerta) : null;
    var ub = umbralAlarma!==""&&umbralAlarma!=null ? Number(umbralAlarma) : null;
    if(crecida==null) return {estado:"Sin distancia normal configurada", cls:"neutral"};
    if(ua==null && ub==null) return {estado:"Sin umbrales configurados", cls:"neutral"};
    if(ub!=null && crecida>=ub) return {estado:"ALARMA", cls:"danger"};
    if(ua!=null && crecida>=ua) return {estado:"ALERTA", cls:"warn"};
    return {estado:"Normal", cls:"ok"};
  }

  function ultimaLecturaRio(){
    if(!state.rioLecturas.length) return null;
    return state.rioLecturas.slice().sort(function(a,b){
      return (b.fecha+"T"+(b.hora||"00:00")).localeCompare(a.fecha+"T"+(a.hora||"00:00"));
    })[0];
  }

  function seccionMonitoreoHTML(){
    var ultima = ultimaLecturaRio();
    var p = state.pronostico;
    var hn = p.distanciaNormalCauce;
    var crecidaActual = ultima ? crecidaRio(ultima.distanciaMedida, hn) : null;
    var nivelActual = ultima ? nivelRio(crecidaActual, p.umbralAlerta, p.umbralAlarma) : null;
    var historial = state.rioLecturas.slice().sort(function(a,b){
      return (b.fecha+"T"+(b.hora||"00:00")).localeCompare(a.fecha+"T"+(a.hora||"00:00"));
    }).map(function(l){
      var crec = crecidaRio(l.distanciaMedida, hn);
      var niv = nivelRio(crec, p.umbralAlerta, p.umbralAlarma);
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px;">'+
        '<span>'+esc(fmtFecha(l.fecha)||"")+' '+esc(l.hora||"")+' — Hc: '+esc(l.distanciaMedida)+' m'+
          (crec!=null? ' · crecida: '+(crec>=0?"+":"")+crec.toFixed(2)+' m' : '')+
          (l.lluviaAcumulada!==""&&l.lluviaAcumulada!=null? ' · lluvia: '+esc(l.lluviaAcumulada)+' mm' : '')+
          (l.observacion?' · '+esc(l.observacion):'')+'</span>'+
        '<span style="display:flex;align-items:center;gap:6px;"><span class="chip '+niv.cls+'">'+niv.estado+'</span>'+
          '<span id="'+ACCIONES_CONFIRMABLES["borrar-registro"].boxId("rioLecturas|"+l.id)+'">'+ACCIONES_CONFIRMABLES["borrar-registro"].render("rioLecturas|"+l.id)+'</span></span>'+
      '</div>';

  // muestra/oculta tarjetas de servicio según el evento elegido en el filtro, sin volver
  // a renderizar toda la vista (así no se pierde lo que se esté tipeando en "Nuevo aviso")
  function aplicarFiltroEvento(){
    var val = state.servicioEventoFiltro;
    Array.prototype.forEach.call(document.querySelectorAll(".feed > .svc"), function(el){
      if(el.classList.contains("inline-form")){ el.style.display = ""; return; }
      var ev = el.getAttribute("data-evento") || "";
      var visible = !val || (val==="__individual__" ? !ev : ev===val);
      el.style.display = visible ? "" : "none";
    });
  }

  // ---------- reportes: participación en servicios por personal / unidad / tipo ----------
  function viewReportes(){
    var desde = state.reporteDesde, hasta = state.reporteHasta;
    var enRango = state.servicios.filter(function(s){
      if(desde && (!s.fecha || s.fecha < desde)) return false;
      if(hasta && (!s.fecha || s.fecha > hasta)) return false;
      return true;
    });

    var porPersonal = {}, porUnidad = {}, porTipo = {};
    enRango.forEach(function(s){
      var ppu = s.personalPorUnidad || {};
      var dnisEnServicio = {};
      Object.keys(ppu).forEach(function(u){ (ppu[u]||[]).forEach(function(dni){ dnisEnServicio[dni] = true; }); });
      Object.keys(dnisEnServicio).forEach(function(dni){
        if(!porPersonal[dni]) porPersonal[dni] = {count:0, unidades:{}, tipos:{}, servicios:[]};
        porPersonal[dni].count++;
        porPersonal[dni].servicios.push(s);
        Object.keys(ppu).forEach(function(u){ if((ppu[u]||[]).indexOf(dni)>-1) porPersonal[dni].unidades[u]=true; });
        if(s.tipo) porPersonal[dni].tipos[s.tipo]=true;
      });
      (s.unidades||[]).forEach(function(u){
        if(!porUnidad[u]) porUnidad[u] = {count:0, tipos:{}, servicios:[]};
        porUnidad[u].count++;
        porUnidad[u].servicios.push(s);
        if(s.tipo) porUnidad[u].tipos[s.tipo]=true;
      });
      var tipoKey = s.tipo || "Sin tipo";
      if(!porTipo[tipoKey]) porTipo[tipoKey] = {count:0, servicios:[]};
      porTipo[tipoKey].count++;
      porTipo[tipoKey].servicios.push(s);
    });

    var qp = state.reporteFiltroPersonal.trim().toLowerCase();
    var listaPersonal = Object.keys(porPersonal).map(function(dni){
      var p = state.personal.filter(function(x){return x.id===dni;})[0];
      return {dni:dni, nombre: p? p.nombre : dni, data: porPersonal[dni]};
    }).filter(function(row){ return !qp || row.nombre.toLowerCase().indexOf(qp)>-1; })
      .sort(function(a,b){ return b.data.count - a.data.count || a.nombre.localeCompare(b.nombre); });

    var listaUnidad = Object.keys(porUnidad).map(function(u){
      var unidadObj = state.unidades.filter(function(x){return x.numero===u;})[0];
      return {numero:u, grupo: unidadObj? unidadObj.grupo : "", data: porUnidad[u]};
    }).sort(function(a,b){ return b.data.count - a.data.count || a.numero.localeCompare(b.numero); });

    var listaTipo = Object.keys(porTipo).map(function(t){
      return {tipo:t, data: porTipo[t]};
    }).sort(function(a,b){ return b.data.count - a.data.count || a.tipo.localeCompare(b.tipo); });

    var totalServicios = enRango.length;
    var totalPersonalTags = enRango.reduce(function(sum,s){
      var set = {};
      Object.keys(s.personalPorUnidad||{}).forEach(function(u){ (s.personalPorUnidad[u]||[]).forEach(function(d){ set[d]=true; }); });
      return sum + Object.keys(set).length;
    }, 0);
    var promedioPersonal = totalServicios ? (totalPersonalTags/totalServicios) : 0;

    function detalleServiciosHTML(servicios, colspan){
      var filas = servicios.slice().sort(function(a,b){ return (b.fecha||"").localeCompare(a.fecha||""); }).map(function(s){
        return '<div style="font-size:12.5px;padding:2px 0;"><b style="color:var(--text);">'+esc(fmtFecha(s.fecha)||"s/fecha")+'</b> — '+esc(s.tipo||"")+' · '+esc(s.direccion||"")+
          (s.evento? ' · <span style="color:var(--accent);font-weight:600;">'+esc(s.evento)+'</span>' : '')+'</div>';
      }).join("");
      return '<tr><td colspan="'+colspan+'" style="background:var(--surface-2);">'+(filas||'<span class="sub">Sin servicios.</span>')+'</td></tr>';
    }

    var filasPersonal = listaPersonal.map(function(row){
      var key = "p:"+row.dni;
      var expandido = state.reporteExpandido === key;
      var unidadesTxt = Object.keys(row.data.unidades).sort().join(", ") || "—";
      var tiposTxt = Object.keys(row.data.tipos).sort().join(", ") || "—";
      return '<tr class="reporte-fila" data-reporte-toggle="'+esc(key)+'">'+
        '<td>'+esc(row.nombre)+'</td>'+
        '<td style="font-variant-numeric:tabular-nums;">'+row.data.count+'</td>'+
        '<td style="font-size:12.5px;color:var(--text-muted);">'+esc(unidadesTxt)+'</td>'+
        '<td style="font-size:12.5px;color:var(--text-muted);">'+esc(tiposTxt)+'</td>'+

  // devuelve los nombres de evento distintos que ya tienen al menos un servicio cargado

    var map = {};
    state.servicios.forEach(function(s){ if(s.evento) map[s.evento] = true; });
    return Object.keys(map).sort(function(a,b){ return a.localeCompare(b); });
  }
