  // bitácora manual del operativo: un renglón de texto libre con fecha/hora por cada novedad
  // que se quiera dejar asentada durante el evento (a diferencia del informe, que es un
  // resumen final, esto queda como un diario cronológico de lo que fue pasando)
  function seccionBitacoraEventoHTML(){
    var eventos = eventosDistintos();
    if(!eventos.length) return "";
    var eventoSel = state.reporteEventoInforme || eventos[0] || "";
    var entradas = state.bitacoraEventos.filter(function(b){ return b.evento === eventoSel; })
      .slice().sort(function(a,b){ return (b.fecha+"T"+(b.hora||"00:00")).localeCompare(a.fecha+"T"+(a.hora||"00:00")); });
    var filas = entradas.map(function(b){
      return '<div style="display:flex;justify-content:space-between;align-items:start;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:13px;">'+
        '<span><b>'+esc(fmtFecha(b.fecha)||"")+' '+esc(b.hora||"")+'</b> — '+esc(b.texto)+'</span>'+
        '<span id="'+ACCIONES_CONFIRMABLES["borrar-registro"].boxId("bitacoraEventos|"+b.id)+'">'+ACCIONES_CONFIRMABLES["borrar-registro"].render("bitacoraEventos|"+b.id)+'</span>'+
      '</div>';
    }).join("");
    return '<div class="card" style="margin-top:16px;">'+
      '<div class="section-head"><h2>Bitácora del operativo</h2><span class="sub">diario cronológico de novedades para "'+esc(eventoSel)+'"</span></div>'+
      '<div class="row-actions" style="margin-top:10px;align-items:end;">'+
        '<div class="field" style="flex:1;min-width:220px;"><label>Novedad</label><input class="mini-input" id="bit_texto" placeholder="Ej: se corta el suministro eléctrico en barrio Centro"></div>'+
        '<button type="button" class="btn primary small" id="btnAgregarBitacora">Agregar</button>'+
      '</div>'+
      '<div style="margin-top:4px;">'+(filas||'<div class="empty" style="margin-top:8px;">Sin novedades cargadas para este evento todavía.</div>')+'</div>'+
    '</div>';
  }

  // fecha+hora de llamado de un servicio, como texto comparable/ordenable
  function fechaHoraOrdenable(s){
    return (s.fecha||"")+"T"+(s.horaLlamado||"00:00");
  }

  function nombrePersonalPorDni(dni){
    var p = state.personal.filter(function(x){ return x.id===dni; })[0];
    return p ? p.nombre : dni;
  }

  function generarTextoInformeEvento(nombreEvento, conNombres){
    var servicios = state.servicios.filter(function(s){ return s.evento === nombreEvento; })
      .slice().sort(function(a,b){ return fechaHoraOrdenable(a).localeCompare(fechaHoraOrdenable(b)); });
    if(!servicios.length) return "";

    var unidadesSet = {}, personalSet = {}, centrosSet = {};
    var totalMayores = 0, totalMenores = 0, algunoActivo = false;
    servicios.forEach(function(s){
      (s.unidades||[]).forEach(function(u){ unidadesSet[u] = true; });
      Object.keys(s.personalPorUnidad||{}).forEach(function(u){
        (s.personalPorUnidad[u]||[]).forEach(function(dni){ personalSet[dni] = true; });
      });
      if(s.centroEvacuacion) centrosSet[s.centroEvacuacion] = true;
      totalMayores += Number(s.mayores)||0;
      totalMenores += Number(s.menores)||0;
      if(s.activo) algunoActivo = true;
    });

    var primero = servicios[0], ultimo = servicios[servicios.length-1];
    var L = [];
    L.push("INFORME DE OPERATIVO");
    L.push("Asociación de Bomberos Voluntarios de Brandsen — Comité de Operaciones de Emergencia (COE)");
    L.push("Tipo de informe: "+(conNombres ? "EXTENDIDO, con nombres — solo uso interno" : "RESUMEN, sin datos personales — apto para difusión externa"));
    L.push("");
    L.push("Evento / Operativo: "+nombreEvento);
    L.push("Período: desde "+fmtFecha(primero.fecha)+" "+(primero.horaLlamado||"")+" hasta "+fmtFecha(ultimo.fecha)+" "+(ultimo.horaLlamado||""));
    L.push("Estado del operativo: "+(algunoActivo ? "EN CURSO" : "FINALIZADO"));
    L.push("");
    L.push("RESUMEN");
    L.push("- Servicios registrados: "+servicios.length);
    L.push("- Unidades intervinientes ("+Object.keys(unidadesSet).length+"): "+(Object.keys(unidadesSet).sort().join(", ")||"—"));
    if(conNombres){
      var nombresPersonal = Object.keys(personalSet).map(nombrePersonalPorDni).sort(function(a,b){ return a.localeCompare(b); });
      L.push("- Personal interviniente ("+nombresPersonal.length+"): "+(nombresPersonal.join(", ")||"—"));
    }else{
      L.push("- Personal interviniente: "+Object.keys(personalSet).length+" persona(s) distinta(s)");
    }
    L.push("- Evacuados: "+totalMayores+" mayor(es), "+totalMenores+" menor(es)");
    if(Object.keys(centrosSet).length) L.push("- Centros de evacuación utilizados: "+Object.keys(centrosSet).sort().join(", "));
    L.push("");
    L.push("DETALLE CRONOLÓGICO DE SERVICIOS");
    servicios.forEach(function(s, i){
      var totalPersonalServicio = totalPersonalSel(s.personalPorUnidad||{}) || s.cantidadPersonal || 0;
      L.push("");
      L.push((i+1)+". "+fmtFecha(s.fecha)+" "+(s.horaLlamado||"")+" — "+(s.tipo||"Servicio"));
      L.push("   Dirección: "+(s.direccion||"—")+(s.localidad?" · "+s.localidad:"")+(s.barrio?" ("+s.barrio+")":""));
      if(s.unidades && s.unidades.length) L.push("   Unidades: "+s.unidades.join(", "));
      if(conNombres){
        var dnisServicio = {};
        Object.keys(s.personalPorUnidad||{}).forEach(function(u){ (s.personalPorUnidad[u]||[]).forEach(function(dni){ dnisServicio[dni]=true; }); });
        var nombresServicio = Object.keys(dnisServicio).map(nombrePersonalPorDni).sort(function(a,b){ return a.localeCompare(b); });
        if(nombresServicio.length) L.push("   Personal interviniente: "+nombresServicio.join(", "));
      }else if(totalPersonalServicio){
        L.push("   Personal interviniente: "+totalPersonalServicio);
      }
      if((Number(s.mayores)||0) || (Number(s.menores)||0)) L.push("   Evacuados: "+(Number(s.mayores)||0)+" mayor(es), "+(Number(s.menores)||0)+" menor(es)");
      if(conNombres){
        var mayDet = s.evacuadosMayoresDetalle||[], menDet = s.evacuadosMenoresDetalle||[];
        mayDet.forEach(function(ev){
          L.push("     · Mayor: "+(ev.nombre||"—")+(ev.dni?" — DNI "+ev.dni:"")+(ev.telefono?" — Tel. "+ev.telefono:"")+(ev.direccion?" — Dom. "+ev.direccion:""));
        });
        menDet.forEach(function(ev){
          L.push("     · Menor: "+(ev.nombre||"—")+(ev.dni?" — DNI "+ev.dni:""));
        });
      }
      if(s.centroEvacuacion) L.push("   Centro de evacuación: "+s.centroEvacuacion);
      if(s.observaciones) L.push("   Observaciones: "+s.observaciones);
      L.push("   Estado: "+(s.activo ? "Activo" : ("Cerrado"+(s.horaRetorno?" (retorno "+fmtHora(s.horaRetorno)+")":""))));
    });
    L.push("");
    L.push("---");
    if(conNombres) L.push("Documento de uso interno: contiene datos personales de personal y evacuados. No difundir fuera de la institución.");
    L.push("Informe generado automáticamente por el Sistema de Gestión de Emergencias Bomberos Voluntarios Brandsen el "+new Date().toLocaleString("es-AR")+".");
    return L.join("\n");
  }

  function exportarInformeEvento(){
    if(!state.informeEventoTexto) return;
    guardarArchivo("informe_"+slugify(state.reporteEventoInforme)+(state.informeEventoConNombres?"_interno":"")+".txt", state.informeEventoTexto, "text/plain;charset=utf-8");
  }

  function buildReportePersonalCSV(){
    var desde = state.reporteDesde, hasta = state.reporteHasta;
    var enRango = state.servicios.filter(function(s){
      if(desde && (!s.fecha || s.fecha < desde)) return false;
      if(hasta && (!s.fecha || s.fecha > hasta)) return false;
      return true;
    });
    var porPersonal = {};
    enRango.forEach(function(s){
      var ppu = s.personalPorUnidad || {};
      var dnisEnServicio = {};
      Object.keys(ppu).forEach(function(u){ (ppu[u]||[]).forEach(function(dni){ dnisEnServicio[dni] = true; }); });
      Object.keys(dnisEnServicio).forEach(function(dni){
        if(!porPersonal[dni]) porPersonal[dni] = {count:0, unidades:{}, tipos:{}};
        porPersonal[dni].count++;
        Object.keys(ppu).forEach(function(u){ if((ppu[u]||[]).indexOf(dni)>-1) porPersonal[dni].unidades[u]=true; });
        if(s.tipo) porPersonal[dni].tipos[s.tipo]=true;
      });
    });
    var filas = [["Nombre","DNI","CantidadServicios","Unidades","Tipos"]];
    Object.keys(porPersonal).map(function(dni){
      var p = state.personal.filter(function(x){return x.id===dni;})[0];
      return {dni:dni, nombre: p? p.nombre : dni, data: porPersonal[dni]};
    }).sort(function(a,b){ return b.data.count - a.data.count || a.nombre.localeCompare(b.nombre); })
      .forEach(function(row){
        filas.push([row.nombre, row.dni, row.data.count, Object.keys(row.data.unidades).sort().join(" / "), Object.keys(row.data.tipos).sort().join(" / ")]);
      });
    return filas.map(function(r){ return r.map(csvCampo).join(","); }).join("\r\n");
  }

  function exportarReportePersonal(){
    var csv = buildReportePersonalCSV();
    guardarArchivo("reporte_personal_brandsen.csv", csv, "text/csv;charset=utf-8");
  }

  // ---------- wiring ----------
  function wireView(){
    wireConfirmaciones(document);
    wirePersonalPicker(document.getElementById("es_personal_unidades"));
    wireUnidadChips(document.getElementById("es_unidades_container"));
    wireEvacuadosAgregar("es"); wireEvacuadosQuitar("es");
    wireEvacuadosAgregar("f"); wireEvacuadosQuitar("f");
    wireEvacuadosAgregar("ic"); wireEvacuadosQuitar("ic");
    var btnGeoEditar = document.getElementById("btnGeoEditar");
    if(btnGeoEditar) btnGeoEditar.addEventListener("click", function(){ capturarUbicacion("es_lat","es_lng","geoStatusEditar"); });
    wireLinkMaps("btnMapsEditar","es_direccion","es_localidad");
    wirePegarCoords("es_pegarCoords","es_lat","es_lng","geoStatusEditar");
    var esLocalidadEl = document.getElementById("es_localidad");
    if(esLocalidadEl){
      esLocalidadEl.addEventListener("change", function(){
        // reordena qué zona de personal aparece primero según la localidad del servicio
        var contP = document.getElementById("es_personal_unidades");
        if(contP){
          contP.innerHTML = '<label>Personal interviniente por unidad</label>' + personalPickerHTML(state.editUnidadesSel, state.editPersonalSel, undefined, localidadFormEdicion());
          wirePersonalPicker(contP);
        }
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll("[data-retorno]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-retorno");
        if(!state.db) return;
        btn.setAttribute("disabled","disabled"); btn.textContent = "Marcando…";
        state.db.collection("servicios").doc(id).update({activo:false, horaRetorno: new Date().toTimeString().slice(0,5)}).then(function(){
          if(state.editingServicioId === id) state.editingServicioId = null;
        }).catch(function(e){
          console.error(e); alert("No se pudo marcar el retorno. Probá de nuevo.");
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-editar-servicio]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-editar-servicio");
        var s = state.servicios.filter(function(x){return x.id===id;})[0];
        if(!s) return;
        state.editingServicioId = id;
        state.editUnidadesSel = (s.unidades||[]).slice();
        state.editPersonalSel = {};
        Object.keys(s.personalPorUnidad||{}).forEach(function(u){
          state.editPersonalSel[u] = (s.personalPorUnidad[u]||[]).slice();
        });
        state.editEvacMayores = (s.evacuadosMayoresDetalle||[]).map(function(x){ return Object.assign({},x); });
        state.editEvacMenores = (s.evacuadosMenoresDetalle||[]).map(function(x){ return Object.assign({},x); });
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-cancelar-servicio]"), function(btn){
      btn.addEventListener("click", function(){ state.editingServicioId = null; render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-guardar-servicio]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-guardar-servicio");
        if(!state.db) return;
        var original = state.servicios.filter(function(x){return x.id===id;})[0] || {};
        var payload = {
          tipo: document.getElementById("es_tipo").value,
          evento: document.getElementById("es_evento").value.trim(),
          solicitante: document.getElementById("es_solicitante").value,
          direccion: document.getElementById("es_direccion").value,
          lat: (function(){ var v = document.getElementById("es_lat").value; return v!==""? Number(v) : null; })(),
          lng: (function(){ var v = document.getElementById("es_lng").value; return v!==""? Number(v) : null; })(),
          localidad: document.getElementById("es_localidad").value,
          barrio: document.getElementById("es_barrio").value,
          unidades: state.editUnidadesSel.slice(),
          personalPorUnidad: (function(){
            var out = {};
            state.editUnidadesSel.forEach(function(u){
              if(state.editPersonalSel[u] && state.editPersonalSel[u].length) out[u] = state.editPersonalSel[u].slice();
            });
            return out;
          })(),
          cantidadPersonal: Number(document.getElementById("es_personal").value)||0,
          mayores: Number(document.getElementById("es_mayores").value)||0,
          menores: Number(document.getElementById("es_menores").value)||0,
          evacuadosMayoresDetalle: leerEvacuadosParaGuardar("es").mayores,
          evacuadosMenoresDetalle: leerEvacuadosParaGuardar("es").menores,
          centroEvacuacion: document.getElementById("es_centro").value,
          observaciones: document.getElementById("es_obs").value,
          horaRetorno: document.getElementById("es_horaRetorno").value
        };
        // si el aviso estaba pendiente (sin unidades) y ahora se le asignan, queda "despachado": registramos la hora
        if(payload.unidades.length && !original.horaDespacho){
          payload.horaDespacho = new Date().toTimeString().slice(0,5);
        }
        // si se cargó (o ya tenía) una hora de retorno y el servicio seguía activo, queda cerrado
        if(payload.horaRetorno && original.activo){
          payload.activo = false;
        }
        if(!payload.tipo || !payload.direccion){
          alert("Completá al menos tipo de emergencia y dirección.");
          return;
        }
        btn.setAttribute("disabled","disabled"); btn.textContent = "Guardando…";
        state.db.collection("servicios").doc(id).update(payload).then(function(){
          state.editingServicioId = null; render();
        }).catch(function(e){
          console.error(e); alert("No se pudo guardar el cambio. Probá de nuevo.");
          btn.removeAttribute("disabled"); btn.textContent = "Guardar cambios";
        });
      });
    });

    if(state.tab==="tablero"){
      var mBtn = document.getElementById("toggleManageUnidades");
      if(mBtn) mBtn.addEventListener("click", function(){
        state.manageUnidades = !state.manageUnidades; state.addingUnidad = false; state.editingUnidadId = null; render();

          fecha: nowISO().slice(0,10),
          hora: nowISO().slice(11,16),
          creadoEn: nowISO()
        }).catch(function(e){ console.error(e); alert("No se pudo registrar la lectura."); });
      });
      var CAMPOS_RIO = {rio_umbralAlerta:"umbralAlerta", rio_umbralAlarma:"umbralAlarma", rio_lugarMedicion:"lugarMedicion", rio_distanciaNormal:"distanciaNormalCauce", rio_inicioLluviasFecha:"inicioLluviasFecha", rio_inicioLluviasHora:"inicioLluviasHora"};
      Object.keys(CAMPOS_RIO).forEach(function(elId){
        var el = document.getElementById(elId);
        if(!el) return;
        el.addEventListener("change", function(){
          if(!state.db) return;
          var patch = {}; patch[CAMPOS_RIO[elId]] = el.value;
          state.db.doc("situacion/monitoreo").set(Object.assign({}, state.pronostico, patch)).catch(function(e){ console.error(e); });
        });
      });
      var btnEditarPronostico = document.getElementById("btnEditarPronostico");
      if(btnEditarPronostico) btnEditarPronostico.addEventListener("click", function(){ state.editandoPronostico = true; render(); });
      var btnCancelarPronostico = document.getElementById("btnCancelarPronostico");
      if(btnCancelarPronostico) btnCancelarPronostico.addEventListener("click", function(){ state.editandoPronostico = false; render(); });
      var btnGuardarPronostico = document.getElementById("btnGuardarPronostico");
      if(btnGuardarPronostico) btnGuardarPronostico.addEventListener("click", function(){
        if(!state.db) return;
        var payload = Object.assign({}, state.pronostico, {
          texto: document.getElementById("pr_texto").value.trim(),
          fuente: document.getElementById("pr_fuente").value.trim(),
          actualizadoEn: nowISO()
        });
        state.db.doc("situacion/monitoreo").set(payload).then(function(){
          state.editandoPronostico = false; render();
        }).catch(function(e){ console.error(e); alert("No se pudo guardar el pronóstico."); });
      });

      // -- matriz de riesgo por localidad --
      var tAR = document.getElementById("toggleAddRiesgo");
      if(tAR) tAR.addEventListener("click", function(){ state.addingRiesgo = !state.addingRiesgo; render(); });
      var cAR = document.getElementById("cancelarRiesgoNuevo");
      if(cAR) cAR.addEventListener("click", function(){ state.addingRiesgo = false; render(); });
      var gAR = document.getElementById("guardarRiesgoNuevo");
      if(gAR) gAR.addEventListener("click", function(){
        if(!state.db) return;
        var localidad = document.getElementById("nr_localidad").value;
        if(!localidad){ alert("Elegí una localidad."); return; }
        var id = "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        state.db.collection("riesgoLocalidades").doc(id).set({
          localidad: localidad,
          nivel: document.getElementById("nr_nivel").value,
          motivo: document.getElementById("nr_motivo").value.trim()
        }).then(function(){ state.addingRiesgo = false; render(); })
        .catch(function(e){ console.error(e); alert("No se pudo agregar."); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-editar-riesgo]"), function(btn){
        btn.addEventListener("click", function(){ state.editingRiesgoId = btn.getAttribute("data-editar-riesgo"); render(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-cancelar-riesgo]"), function(btn){
        btn.addEventListener("click", function(){ state.editingRiesgoId = null; render(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-guardar-riesgo]"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-guardar-riesgo");
          if(!state.db) return;
          state.db.collection("riesgoLocalidades").doc(id).update({
            localidad: document.getElementById("er_localidad").value,
            nivel: document.getElementById("er_nivel").value,
            motivo: document.getElementById("er_motivo").value.trim()
          }).then(function(){ state.editingRiesgoId = null; render(); })
          .catch(function(e){ console.error(e); alert("No se pudo guardar."); });
        });
      });

      // -- helipuertos --
      var tAH = document.getElementById("toggleAddHelipuerto");
      if(tAH) tAH.addEventListener("click", function(){ state.addingHelipuerto = !state.addingHelipuerto; render(); });
      var cAH = document.getElementById("cancelarHelipuertoNuevo");
      if(cAH) cAH.addEventListener("click", function(){ state.addingHelipuerto = false; render(); });
      var gAH = document.getElementById("guardarHelipuertoNuevo");
      if(gAH) gAH.addEventListener("click", function(){
        if(!state.db) return;
        var nombre = document.getElementById("nh_nombre").value.trim();
        if(!nombre){ alert("Poné un nombre o referencia."); return; }
        var id = "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        state.db.collection("helipuertos").doc(id).set({
          nombre: nombre,
          ubicacion: document.getElementById("nh_ubicacion").value.trim(),
          responsable: document.getElementById("nh_responsable").value.trim(),
          telefono: document.getElementById("nh_telefono").value.trim(),
          estado: document.getElementById("nh_estado").value.trim()
        }).then(function(){ state.addingHelipuerto = false; render(); })
        .catch(function(e){ console.error(e); alert("No se pudo agregar."); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-editar-helipuerto]"), function(btn){
        btn.addEventListener("click", function(){ state.editingHelipuertoId = btn.getAttribute("data-editar-helipuerto"); render(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-cancelar-helipuerto]"), function(btn){
        btn.addEventListener("click", function(){ state.editingHelipuertoId = null; render(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-guardar-helipuerto]"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-guardar-helipuerto");
          if(!state.db) return;
          var nombre = document.getElementById("eh_nombre").value.trim();
          if(!nombre){ alert("El nombre no puede quedar vacío."); return; }
          state.db.collection("helipuertos").doc(id).update({
            nombre: nombre,
            ubicacion: document.getElementById("eh_ubicacion").value.trim(),
            responsable: document.getElementById("eh_responsable").value.trim(),
            telefono: document.getElementById("eh_telefono").value.trim(),
            estado: document.getElementById("eh_estado").value.trim()
          }).then(function(){ state.editingHelipuertoId = null; render(); })
          .catch(function(e){ console.error(e); alert("No se pudo guardar."); });
        });
      });

      // -- contactos de coordinación interagencial --
      var tACt = document.getElementById("toggleAddContacto");
      if(tACt) tACt.addEventListener("click", function(){ state.addingContacto = !state.addingContacto; render(); });
      var cACt = document.getElementById("cancelarContactoNuevo");
      if(cACt) cACt.addEventListener("click", function(){ state.addingContacto = false; render(); });
      var gACt = document.getElementById("guardarContactoNuevo");
      if(gACt) gACt.addEventListener("click", function(){
        if(!state.db) return;
        var nombre = document.getElementById("nct_nombre").value.trim();
        if(!nombre){ alert("Poné el nombre del contacto."); return; }
        var id = "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        state.db.collection("contactos").doc(id).set({
          organismo: document.getElementById("nct_organismo").value.trim(),
          nombre: nombre,
          cargo: document.getElementById("nct_cargo").value.trim(),
          telefono: document.getElementById("nct_telefono").value.trim(),
          notas: document.getElementById("nct_notas").value.trim()
        }).then(function(){ state.addingContacto = false; render(); })
        .catch(function(e){ console.error(e); alert("No se pudo agregar."); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-editar-contacto]"), function(btn){
        btn.addEventListener("click", function(){ state.editingContactoId = btn.getAttribute("data-editar-contacto"); render(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-cancelar-contacto]"), function(btn){
        btn.addEventListener("click", function(){ state.editingContactoId = null; render(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-guardar-contacto]"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-guardar-contacto");
          if(!state.db) return;
          var nombre = document.getElementById("ect_nombre").value.trim();
          if(!nombre){ alert("El nombre no puede quedar vacío."); return; }
          state.db.collection("contactos").doc(id).update({
            organismo: document.getElementById("ect_organismo").value.trim(),
            nombre: nombre,
            cargo: document.getElementById("ect_cargo").value.trim(),
            telefono: document.getElementById("ect_telefono").value.trim(),
            notas: document.getElementById("ect_notas").value.trim()
          }).then(function(){ state.editingContactoId = null; render(); })
          .catch(function(e){ console.error(e); alert("No se pudo guardar."); });
        });
      });
    }
  }

  // ---------- boot ----------
  function setLive(text, ok){
    document.getElementById("liveText").textContent = text;
    document.getElementById("livePill").style.color = ok? "var(--ok)":"var(--warn)";
  }

  // se llama una sola vez, apenas se valida la sesión — pide todas las colecciones a las
  // que el rol admin tiene acceso (el rol "centro" usa iniciarDatosAppCentro, más abajo)
  function iniciarDatosApp(){
    var db = state.db;

    db.collection("unidades").onSnapshot(function(snap){
      state.unidades = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("unidades", e); });

    db.collection("servicios").onSnapshot(function(snap){
      state.servicios = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("servicios", e); });

    db.collection("personal").onSnapshot(function(snap){
      state.personal = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("personal", e); });

    db.collection("centrosEvacuacion").onSnapshot(function(snap){
      state.centros = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("centros", e); });

    db.collection("ingresosDirectosCentro").onSnapshot(function(snap){
      state.ingresosDirectos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("ingresosDirectosCentro", e); });

    db.collection("rioLecturas").onSnapshot(function(snap){
      state.rioLecturas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("rioLecturas", e); });

    db.doc("situacion/monitoreo").onSnapshot(function(snap){
      if(snap.exists) state.pronostico = Object.assign({texto:"",fuente:"",actualizadoEn:"",umbralAlerta:"",umbralAlarma:"",lugarMedicion:"",distanciaNormalCauce:"",inicioLluviasFecha:"",inicioLluviasHora:""}, snap.data());
      render();
    }, function(e){ console.error("monitoreo", e); });

    db.collection("riesgoLocalidades").onSnapshot(function(snap){
      state.riesgoLocalidades = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("riesgoLocalidades", e); });

    db.collection("helipuertos").onSnapshot(function(snap){
      state.helipuertos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("helipuertos", e); });

    db.collection("contactos").onSnapshot(function(snap){
      state.contactos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("contactos", e); });

    db.collection("bitacoraEventos").onSnapshot(function(snap){
      state.bitacoraEventos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("bitacoraEventos", e); });

    db.doc("catalogos/opciones").onSnapshot(function(snap){
      if(snap.exists) state.catalogos = Object.assign({tipos:[],localidades:[],barrios:[]}, snap.data());
      render();
    }, function(e){ console.error("catalogos", e); });

    db.alListo(function(){ state.ready = true; render(); });
    db.alCambio(function(){
      var err = db.ultimoError();
      setLive(err ? (state.ready? "Sin conexión — reintentando…" : "Error de conexión") : "En vivo", !err);
      render();
    });
    setLive("En vivo", true);
  }

  // versión reducida para el rol "centro": solo pide lo que el backend le va a devolver
  // para ese rol (su propio centro, los servicios que lo tienen asignado, y sus ingresos
  // directos) — el resto de las colecciones no aplican y quedan vacías
  function iniciarDatosAppCentro(){
    var db = state.db;

    db.collection("centrosEvacuacion").onSnapshot(function(snap){
      state.centros = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("centros", e); });

    db.collection("servicios").onSnapshot(function(snap){
      state.servicios = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("servicios", e); });

    db.collection("ingresosDirectosCentro").onSnapshot(function(snap){
      state.ingresosDirectos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(e){ console.error("ingresosDirectosCentro", e); });

    db.alListo(function(){ state.ready = true; render(); });
    db.alCambio(function(){
      var err = db.ultimoError();
      setLive(err ? (state.ready? "Sin conexión — reintentando…" : "Error de conexión") : "En vivo", !err);
      render();
    });
    setLive("En vivo", true);
  }

  // arranca la carga de datos según el rol de la sesión ya validada
  function arrancarDatos(){
    renderNav();
    if(state.sesion.rol === "centro"){
      state.tab = "centros";
      iniciarDatosAppCentro();
    } else {
      iniciarDatosApp();
    }
    render();
  }

  function start(){
    renderNav();
    var guardada = null;
    try{ guardada = JSON.parse(localStorage.getItem(CLAVE_SESION_LOCAL) || "null"); }catch(e){}
    if(guardada && guardada.token){
      iniciarSesion(guardada.token, true);
    } else {
      render();
    }
  }
  start();
})();
</script>
</body>
</html>
